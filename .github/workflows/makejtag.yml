name: Build Stages JTAG Firmware

on:
  push:
    branches: [ bipolar ]
  pull_request:
    branches: [ bipolar ]
  workflow_dispatch:

jobs:
  build_firmware:
    name: Build ${{ matrix.config.name }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        config:
          - name: "stages-${{ github.ref_name }}-jtag"
            make_target: "build/stages/stages_bootloader_combo.bin"
            combo_bin: "build/stages/stages_bootloader_combo.bin"
            combo_hex: "build/stages/stages_bootloader_combo.hex"
          - name: "stages-${{ github.ref_name }}-flipped-jtag"
            make_target: "FLIPPED=1 build/stages-flipped/stages-flipped_bootloader_combo.bin"
            combo_bin: "build/stages-flipped/stages-flipped_bootloader_combo.bin"
            combo_hex: "build/stages-flipped/stages-flipped_bootloader_combo.hex"
    env:
      TOOLCHAIN_PATH: ./arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/

    steps:
    - uses: actions/checkout@v4

    - name: submodule init
      run: git submodule init && git submodule update

    - name: setup python 2.y
      run: |
        sudo apt update
        sudo apt install python2
        wget --quiet "https://bootstrap.pypa.io/pip/2.7/get-pip.py" -O get-pip.py
        sudo python2 get-pip.py
        python2 -m pip install numpy

    - name: setup arm toolchain
      run: |
        echo "Downloading to slightly different name to match name of extracted folder: arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi"
        wget --quiet -O "arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi" "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz?rev=e434b9ea4afc4ed7998329566b764309&hash=CA590209F5774EE1C96E6450E14A3E26"
        tar -xf arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi

    - name: build and copy ${{ matrix.config.name }}
      run: |
        # The bootloader is a separate make project; the combo image depends on
        # build/stages_bootloader/stages_bootloader.hex, which the main makefile
        # does not know how to build, so build it first. There is a single
        # (non-flipped) bootloader shared by both the normal and flipped combos.
        make -f stages/bootloader/makefile
        # Build the combined bootloader + application image. This is the same
        # image that `make upload_combo_jtag_erase_first` flashes to 0x08000000,
        # so it can be flashed over JTAG/SWD with openocd, an ST-Link, a J-Link, etc.
        make -f stages/makefile ${{ matrix.config.make_target }}
        short_sha=$(echo ${{ github.sha }} | cut -c1-7)
        artifact_name="${{ matrix.config.name }}-$short_sha"
        mkdir -p "$artifact_name"
        cp ${{ matrix.config.combo_bin }} "$artifact_name/$artifact_name.bin"
        cp ${{ matrix.config.combo_hex }} "$artifact_name/$artifact_name.hex"
        echo "ARTIFACT_NAME=$artifact_name" >> $GITHUB_ENV

    - name: upload ${{ matrix.config.name }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_NAME }}
